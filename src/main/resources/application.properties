spring.application.name=inshore-pos

spring.datasource.url=jdbc:postgresql://localhost:5432/InshorePosDB
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Safety net for any lazy association/collection not covered by an explicit
# JOIN FETCH in a repository query (e.g. Order.items on the Top-5 listing):
# instead of firing one SELECT per row, Hibernate batches up to this many
# missing rows into a single "WHERE id IN (...)" SELECT.
spring.jpa.properties.hibernate.default_batch_fetch_size=25

jwt.secret=${INSHORE_JWT_SECRET}

# ============================================================
# Rate limiting (Redis + Bucket4j)
# ============================================================
# Master switch. Set to false to fully bypass the limiter (e.g. in some local/dev setups).
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}

# If Redis is unreachable: true = let requests through (availability first, logged as a warning),
# false = reject with 429 (safety first). Recommended: true for a POS system - checkout traffic
# should not go down just because the rate limiter's Redis is having a bad day.
app.rate-limit.fail-open=${RATE_LIMIT_FAIL_OPEN:true}

# Only trust X-Forwarded-For / X-Real-IP when this app actually sits behind a reverse proxy /
# load balancer that sets them. Leave false otherwise, or clients can spoof their way past
# per-IP limits by sending their own X-Forwarded-For header.
app.rate-limit.trust-forwarded-header=${RATE_LIMIT_TRUST_FORWARDED_HEADER:false}

# How long an idle bucket is allowed to live in Redis after it last refilled to full capacity,
# so abandoned per-IP/per-user keys eventually expire instead of accumulating forever.
app.rate-limit.bucket-ttl-minutes=${RATE_LIMIT_BUCKET_TTL_MINUTES:10}

# Paths the limiter never touches.
app.rate-limit.excluded-paths=/actuator/**,/error,/favicon.ico

# --- Policy: POST /auth/login - keyed by client IP. Tight, because this endpoint is the
# classic target for credential-stuffing / brute-force. Burst + hourly sustained limit.
app.rate-limit.login.capacity=${RATE_LIMIT_LOGIN_CAPACITY:5}
app.rate-limit.login.refill-tokens=${RATE_LIMIT_LOGIN_REFILL_TOKENS:5}
app.rate-limit.login.refill-period-seconds=${RATE_LIMIT_LOGIN_REFILL_PERIOD_SECONDS:60}
app.rate-limit.login.secondary-capacity=${RATE_LIMIT_LOGIN_SECONDARY_CAPACITY:20}
app.rate-limit.login.secondary-refill-tokens=${RATE_LIMIT_LOGIN_SECONDARY_REFILL_TOKENS:20}
app.rate-limit.login.secondary-refill-period-seconds=${RATE_LIMIT_LOGIN_SECONDARY_REFILL_PERIOD_SECONDS:3600}

# --- Policy: POST /auth/signup - keyed by client IP. Slightly tighter than login, guards
# against automated account-creation / spam signups.
app.rate-limit.signup.capacity=${RATE_LIMIT_SIGNUP_CAPACITY:3}
app.rate-limit.signup.refill-tokens=${RATE_LIMIT_SIGNUP_REFILL_TOKENS:3}
app.rate-limit.signup.refill-period-seconds=${RATE_LIMIT_SIGNUP_REFILL_PERIOD_SECONDS:60}
app.rate-limit.signup.secondary-capacity=${RATE_LIMIT_SIGNUP_SECONDARY_CAPACITY:10}
app.rate-limit.signup.secondary-refill-tokens=${RATE_LIMIT_SIGNUP_SECONDARY_REFILL_TOKENS:10}
app.rate-limit.signup.secondary-refill-period-seconds=${RATE_LIMIT_SIGNUP_SECONDARY_REFILL_PERIOD_SECONDS:3600}

# --- Policy: everything under /api/** - keyed by the authenticated user's email when a valid
# JWT is present, otherwise falls back to client IP. Sized for normal POS usage (order/product/
# inventory calls can be bursty at checkout time) with an hourly ceiling behind it.
app.rate-limit.authenticated-api.capacity=${RATE_LIMIT_API_CAPACITY:120}
app.rate-limit.authenticated-api.refill-tokens=${RATE_LIMIT_API_REFILL_TOKENS:120}
app.rate-limit.authenticated-api.refill-period-seconds=${RATE_LIMIT_API_REFILL_PERIOD_SECONDS:60}
app.rate-limit.authenticated-api.secondary-capacity=${RATE_LIMIT_API_SECONDARY_CAPACITY:3000}
app.rate-limit.authenticated-api.secondary-refill-tokens=${RATE_LIMIT_API_SECONDARY_REFILL_TOKENS:3000}
app.rate-limit.authenticated-api.secondary-refill-period-seconds=${RATE_LIMIT_API_SECONDARY_REFILL_PERIOD_SECONDS:3600}

# --- Policy: any other public/permitAll endpoint - keyed by client IP.
app.rate-limit.public-api.capacity=${RATE_LIMIT_PUBLIC_CAPACITY:60}
app.rate-limit.public-api.refill-tokens=${RATE_LIMIT_PUBLIC_REFILL_TOKENS:60}
app.rate-limit.public-api.refill-period-seconds=${RATE_LIMIT_PUBLIC_REFILL_PERIOD_SECONDS:60}

# --- Dedicated Redis connection used only by the rate limiter (kept separate from any future
# spring-data-redis usage elsewhere in the app - see the pom.xml comment on bucket4j_jdk17-lettuce).
app.rate-limit.redis.host=${RATE_LIMIT_REDIS_HOST:localhost}
app.rate-limit.redis.port=${RATE_LIMIT_REDIS_PORT:6379}
app.rate-limit.redis.password=${RATE_LIMIT_REDIS_PASSWORD:}
app.rate-limit.redis.database=${RATE_LIMIT_REDIS_DATABASE:0}
app.rate-limit.redis.ssl=${RATE_LIMIT_REDIS_SSL:false}
app.rate-limit.redis.connect-timeout-ms=${RATE_LIMIT_REDIS_CONNECT_TIMEOUT_MS:2000}
app.rate-limit.redis.command-timeout-ms=${RATE_LIMIT_REDIS_COMMAND_TIMEOUT_MS:2000}